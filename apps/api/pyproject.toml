[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-api"
version = "0.1.0"
description = "PRISM (Predictive Relocation & Infrastructure Safety Matrix) Engine & API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "pyproj>=3.6.0",
    "networkx>=3.3",
    "ortools>=9.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
